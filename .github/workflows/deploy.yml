name: Deploy to Server
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: botkit-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the deployment revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Deploy through the restricted SSH account
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.BOTKIT_DEPLOY_KEY }}
        run: |
          set -Eeuo pipefail
          test -n "$DEPLOY_KEY" || { echo '::error::Set BOTKIT_DEPLOY_KEY for the new server'; exit 1; }
          key="$RUNNER_TEMP/botkit-ssh-key"
          hosts="$RUNNER_TEMP/botkit-known-hosts"
          umask 077
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$key"
          ssh-keygen -y -f "$key" > /dev/null
          ssh-keyscan -T 15 -t ed25519 157.228.114.185 > "$hosts"
          test "$(ssh-keygen -lf "$hosts" -E sha256 | awk '{print $2}')" = 'SHA256:D29s6veodpMzxn6K89p6e5OIV0VjJ/QK/6pfS/qX/f8'
          git archive --format=tar "$GITHUB_SHA" | \
            ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$hosts" \
              botkit-deploy@157.228.114.185 "deploy $GITHUB_SHA"
