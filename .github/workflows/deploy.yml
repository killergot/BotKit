name: Deploy to Server
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: botkit-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy tested image with backup and rollback
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_USER: ${{ secrets.SSH_USERNAME }}
          DEPLOY_KEY: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_PORT: ${{ secrets.SERVER_PORT || 22 }}
        run: |
          set -Eeuo pipefail
          stage=configuration
          trap 'echo "::error::BotKit deploy failed at stage: $stage"' ERR
          key="$RUNNER_TEMP/botkit-ssh-key"
          hosts="$RUNNER_TEMP/botkit-known-hosts"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > "$key"
          ssh-keygen -y -f "$key" > /dev/null
          stage=host-key-verification
          ssh-keyscan -T 15 -t ed25519 -p "$DEPLOY_PORT" "$DEPLOY_HOST" > "$hosts"
          test "$(ssh-keygen -lf "$hosts" -E sha256 | awk '{print $2}')" = 'SHA256:2Jot+dO3LVQPOj3iMRv3bdlW3I1cIupmBJc0VpsHY6k'
          stage=ssh-deployment
          ssh -i "$key" -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            -o HostKeyAlgorithms=ssh-ed25519 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$hosts" "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$GITHUB_SHA" <<'REMOTE'
          set -Eeuo pipefail
          revision=$1
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          cd projects/BotKit
          git fetch origin main
          git merge --ff-only "$revision"
          test "$(git rev-parse HEAD)" = "$revision"
          bash scripts/deploy.sh
          REMOTE
